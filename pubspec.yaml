name: fix_flow_a_i
description: FixFlow AI - Smart Repair Assistant App powered by AI and Automation.

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # UI + Core
  cupertino_icons: ^1.0.0
  auto_size_text: ^3.0.0
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.1.0
  lottie: ^2.7.0
  flutter_animate: ^4.5.0
  page_transition: ^2.1.0
  go_router: ^12.1.3
  dropdown_button2: ^2.3.9

  # Data + Logic
  collection: ^1.19.0
  provider: ^6.1.2
  equatable: ^2.0.5
  rxdart: ^0.27.7
  intl: ^0.20.2
  json_path: ^0.7.2
  timeago: ^3.6.1

  # Networking
  http: ^1.2.2
  mime_type: ^1.0.0

  # Firebase
  firebase_core: ^3.4.0
  firebase_auth: ^5.4.1
  firebase_performance: ^0.10.1

  # Sign-in
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2

  # File/Image/Cache
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.4

  # Storage
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1

  # Utility
  from_css_color: ^2.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  lints: ^4.0.0
  image: ^4.2.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  image_path: "assets/images/app_launcher_icon.PNG"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/
