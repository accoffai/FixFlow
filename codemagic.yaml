workflows:
  fixflow_ai_build:
    name: FixFlow AI - Full Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.accountableofficers.fixflow"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: iOS clean setup (Fix CocoaPods)
        script: |
          rm -rf ios/Pods ios/Podfile.lock
          pod cache clean --all
          cd ios
          pod install --repo-update
          cd ..
      - name: Build Android APK
        script: |
          flutter build apk --release
      - name: Build iOS
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/**/outputs/**/*.apk
      - build/ios/iphoneos/*.app
    publishing:
      email:
        recipients:
          - accoffai@aohub.biz
        notify:
          success: true
          failure: true
