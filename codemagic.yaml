workflows:
  build-fixflow:
    name: FixFlow Android + iOS Build
    environment:
      flutter: "3.19.0"
      vars:
        OPENAI_API_KEY: Encrypted(OPENAI_API_KEY)
        XANO_BASE_URL: Encrypted(XANO_BASE_URL)
        APP_STORE_CONNECT_ISSUER_ID: Encrypted(APP_STORE_CONNECT_ISSUER_ID)
        APP_STORE_CONNECT_KEY_IDENTIFIER: Encrypted(APP_STORE_CONNECT_KEY_IDENTIFIER)
        APP_STORE_CONNECT_PRIVATE_KEY: Encrypted(APP_STORE_CONNECT_PRIVATE_KEY)
        GOOGLE_PLAY_JSON_KEY: Encrypted(GOOGLE_PLAY_JSON_KEY)
    scripts:
      - name: Install Dependencies
        script: flutter pub get
      - name: Build Android APK
        script: flutter build apk --dart-define=OPENAI_API_KEY=$OPENAI_API_KEY --dart-define=XANO_BASE_URL=$XANO_BASE_URL
      - name: Build iOS
        script: flutter build ios --release --no-codesign --dart-define=OPENAI_API_KEY=$OPENAI_API_KEY --dart-define=XANO_BASE_URL=$XANO_BASE_URL
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/ios/iphoneos/Runner.app
