workflows:
  fixflow_ai_build:
    name: FixFlow AI - Full Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.accountableofficers.fixflow"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Run tests
        script: |
          flutter test
      - name: Build Android APK
        script: |
          flutter build apk --release
      - name: Build iOS
        script: |
          flutter build ios --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/ios/iphoneos/*.app
    code_signing:
      ios:
        provisioning_profiles:
          - path: ios_profile.mobileprovision
        certificates:
          - certificate: ios_distribution.p12
            password: EnTerYoUrPaSsHere
    publishing:
      email:
        recipients:
          - accoffai@aohub.biz
        notify:
          success: true
          failure: true

